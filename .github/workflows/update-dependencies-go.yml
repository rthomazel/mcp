name: Update Go dependencies

on:
  schedule:
    - cron: "0 12 * * 1" # Monday 12:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-dependencies-go-${{ matrix.module }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        module: [bench, keys, postgres]

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # Full history needed so the update-go action can diff against origin/main
          fetch-depth: 0

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - uses: eleanorhealth/actions/update-go@update-go/v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.module }}
          # unipdf: license key expires per version; update manually when renewed
          pinned-deps: github.com/unidoc/unipdf/v3
          pr-branch: chore/update-dependencies-go-${{ matrix.module }}
